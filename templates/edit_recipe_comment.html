<a href="#edit-comment-{{ comment.id }}" class="button button-alt">Edit</a>

<div id="edit-comment-{{ comment.id }}" class="modal">
  <div class="modal-content">
    <form 
    action="{{ url_for('edit_comment', comment_id=comment.id) }}" 
    method="post"
    class="flex-column">
    <h3 class="margin-bottom-1">Edit comment</h3>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <label for="comment-{{ comment.id }}">Comment</label>
    <textarea
      id="comment-{{ comment.id }}"
      maxlength="5000"
      name="comment"
      rows="3"
      required
      class="min-w-500"
    >{{ comment.value }}</textarea>

      <div class="flex-center">
        <a href="#" class="button">
          Cancel
        </a>

        <button type="submit" class="button button-primary">
          Save
        </button>
      </div>
    </form>
  </div>
</div>
