<a href="#remove-recipe-{{ recipe.id }}" class="button button-danger">Remove recipe</a>

<div id="remove-recipe-{{ recipe.id }}" class="modal">
  <div class="modal-content">
   <form action="{{ url_for('recipes.remove_recipe', recipe_id=recipe.id) }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <p>Do you want to remove the recipe?</p>

      <button type="submit" class="button button-danger">
        Remove recipe
      </button>

        <a href="#" class="button">
          Cancel
        </a>
    </form>
  </div>
</div>
