<a href="#edit-rating-{{ rating.id }}"  class="button button-alt">Change rating</a>

<div id="edit-rating-{{ rating.id }}" class="modal">
  <div class="modal-content">
   <form 
    action="{{ url_for('recipes.edit_rating', rating_id=user_rating.id) }}" 
    method="post"
    class="flex-column">
    <p>Edit rating</p>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <label for="edit-rating">Rating (1–5)</label>
    <input
      id="edit-rating"
      name="rating"
      type="number"
      min="1"
      max="5"
      required
      value="{{ user_rating.value }}"
    >

      <button type="submit" class="button button-primary">
        Save
      </button>

      <a href="#"  class="button">
        Cancel
      </a>
    </form>
  </div>
</div>
