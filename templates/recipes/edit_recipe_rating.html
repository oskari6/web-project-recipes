<a href="#edit-rating-{{ user_rating.id }}" class="button button-alt">Change rating</a>

<div id="edit-rating-{{ user_rating.id }}" class="modal">
  <div class="modal-content">
   <form 
    action="{{ url_for('recipes.edit_rating', rating_id=user_rating.id) }}" 
    method="post"
    class="flex-column"
    style="width: 150px;">
    <p>Change rating</p>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <label for="edit-rating">Rating (1–5)</label>
    <input
      id="edit-rating"
      name="rating"
      type="number"
      min="1"
      max="5"
      required
      value="{{ user_rating.value }}"
    >

    <div class="flex-center" style="gap: 2px">
      <a href="#" class="button">
        Cancel
      </a>
      <button type="submit" class="button button-primary">
        Save
      </button>
    </div>

    </form>
  </div>
</div>
