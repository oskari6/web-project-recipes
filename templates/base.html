<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/css/main.css" />
    <link
      rel="icon"
      href="{{ url_for('static', filename='favicon.png') }}"
    >
    <title>{% block title %}Recipe App{% endblock %}</title>
  </head>

  <body>
    <header>
      <img class="nav-logo" src="/static/images/icon.png" alt="Recipe App logo"/>
      <nav class="container">
        <a href="/">Home</a>
        <a href="/recipes/create">Contribute</a>
        <a href="/recipes/1">Recipes</a>
        <a href="/users/1">Users</a>
        {% if session.user_id %}
          <a href="/users/user/{{session.user_id}}">My profile</a>
          {% include "auth/logout.html" %}
        {% else %}
          <a href="/auth/login">Sign in</a>
          <a href="/auth/register">Register</a>
        {% endif %}
      </nav>
        <h1 style="margin-left: auto; white-space: nowrap;">Recipe App</h1>
    </header>

    {% include "notification.html" %}

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer>
      <div class="footer-container">
        <span>&copy; 2026 Recipe App</span>

          <a href="https://github.com/oskari6/web-project-recipes" target="_blank" rel="noopener noreferrer">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path d="M12 .7a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.2.8-.5v-2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.4-1.3-5.4-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.4 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5A11.5 11.5 0 0 0 12 .7z"/>
            </svg>
            GitHub
          </a>
      </div>
    </footer>
  </body>
</html>
