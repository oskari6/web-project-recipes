{% extends "base.html" %}
{% block title %}Home - Recipe App{% endblock %}
{% block content %}
  <section class="hero">
  <div class="hero-text">
    <span class="hero-label">Discover something new</span>
    <h1>Recipes worth sharing.</h1>
    <p>
      Discover recipes from other home cooks, save some inspiration,
      or share your own creations with the community.
    </p>

    <a href="/recipes/1" class="button">Explore recipes</a>
  </div>

  <div class="hero-images">
    <img
      class="hero-image vertical"
      src="{{ url_for('static', filename='images/hero3.jpg') }}"
      alt="Recipe"
    >

    <img
      class="hero-image horizontal"
      src="{{ url_for('static', filename='images/hero2.jpg') }}"
      alt="Recipe"
    >

    <img
      class="hero-image horizontal"
      src="{{ url_for('static', filename='images/hero1.png') }}"
      alt="Recipe"
    >

    <img
      class="hero-image vertical"
      src="{{ url_for('static', filename='images/hero4.jpg') }}"
      alt="Recipe"
    >
  </div>
</section>
{% endblock %}
