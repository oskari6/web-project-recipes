{% if error %}
  <div class="notification notification-error padding-1" role="alert">
    <ul>
      {% for message in ([error] if error is string else error) %}
        <li>{{ message }}</li>
      {% endfor %}
    </ul>
    <button type="button"
            class="notification-close"
            onclick="this.parentElement.remove()">
      &times;
    </button>
  </div>
{% endif %}

{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="notification notification-{{ category }} padding-1">
      <span>{{ message }}</span>
      <button type="button"
              class="notification-close"
              onclick="this.parentElement.remove()">
        &times;
      </button>
    </div>
  {% endfor %}
{% endwith %}
