<a href="#remove-comment-{{ comment.id }}" class="button button-danger">Remove</a>

<div id="remove-comment-{{ comment.id }}" class="modal">
  <div class="modal-content">
    <h3 class="margin-bottom-1">Do you want to remove the comment?</h3>

    <form
      action="{{ url_for('remove_comment', comment_id=comment.id) }}"
      method="post"
    >
      <input type="hidden"name="csrf_token" value="{{ session.csrf_token }}">

      <button type="submit" class="button button-danger">
        Confirm
      </button>

        <a href="#" class="button">
          Cancel
        </a>
    </form>
  </div>
</div>
