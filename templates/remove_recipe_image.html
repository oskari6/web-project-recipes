<a href="#remove-image" class="button button-danger">Remove</a>

<div id="remove-image" class="modal">
  <div class="modal-content">
   <form action="{{ url_for('remove_image') }}" method="post">
    <h3 class="margin-bottom-1">Do you want to remove the image?</h3>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"
    >
      <button type="submit" class="button button-danger">
        Confirm
      </button>

        <a href="#" class="button">
          Cancel
        </a>
    </form>
  </div>
</div>
